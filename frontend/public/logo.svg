<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f4ec"/>
      <stop offset="1" stop-color="#eee6d0"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a2020"/>
      <stop offset="1" stop-color="#4a0f0f"/>
    </linearGradient>
    <clipPath id="sealClip">
      <circle cx="256" cy="256" r="212"/>
    </clipPath>
  </defs>

  <!-- Rounded plaque -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <rect x="14" y="14" width="484" height="484" rx="82" fill="none" stroke="#1c1c1c" stroke-width="4" opacity="0.9"/>

  <!-- Concentric court seal ring -->
  <circle cx="256" cy="256" r="212" fill="none" stroke="url(#ink)" stroke-width="10"/>
  <circle cx="256" cy="256" r="198" fill="none" stroke="url(#ink)" stroke-width="2" opacity="0.55"/>

  <g clip-path="url(#sealClip)">
    <!-- Diff-hunk ledger lines behind the scale -->
    <g opacity="0.10" stroke="#1c1c1c" stroke-width="2">
      <line x1="80"  y1="150" x2="432" y2="150"/>
      <line x1="80"  y1="180" x2="432" y2="180"/>
      <line x1="80"  y1="210" x2="432" y2="210"/>
      <line x1="80"  y1="240" x2="432" y2="240"/>
      <line x1="80"  y1="330" x2="432" y2="330"/>
      <line x1="80"  y1="360" x2="432" y2="360"/>
      <line x1="80"  y1="390" x2="432" y2="390"/>
    </g>

    <!-- Diff hunk plus/minus markers, tinted -->
    <g font-family="'IBM Plex Mono','Menlo',monospace" font-weight="600" font-size="20" opacity="0.55">
      <text x="96"  y="185" fill="#2f6b3d">+</text>
      <text x="96"  y="215" fill="#2f6b3d">+</text>
      <text x="96"  y="245" fill="#7a2020">-</text>
      <text x="96"  y="335" fill="#2f6b3d">+</text>
      <text x="96"  y="365" fill="#7a2020">-</text>
      <text x="96"  y="395" fill="#7a2020">-</text>
    </g>

    <!-- Beam -->
    <line x1="120" y1="256" x2="392" y2="256" stroke="url(#ink)" stroke-width="10" stroke-linecap="round"/>
    <!-- Center post -->
    <line x1="256" y1="128" x2="256" y2="256" stroke="url(#ink)" stroke-width="10" stroke-linecap="round"/>
    <!-- Suspension chains -->
    <line x1="152" y1="256" x2="152" y2="298" stroke="url(#ink)" stroke-width="4"/>
    <line x1="360" y1="256" x2="360" y2="298" stroke="url(#ink)" stroke-width="4"/>

    <!-- Left pan (plus / additions) -->
    <path d="M96 300 Q152 360 208 300 Z" fill="none" stroke="url(#ink)" stroke-width="8" stroke-linejoin="round"/>
    <text x="152" y="335" text-anchor="middle" font-family="'IBM Plex Mono','Menlo',monospace" font-weight="700" font-size="34" fill="url(#ink)">+</text>

    <!-- Right pan (minus / removals) -->
    <path d="M304 300 Q360 360 416 300 Z" fill="none" stroke="url(#ink)" stroke-width="8" stroke-linejoin="round"/>
    <text x="360" y="335" text-anchor="middle" font-family="'IBM Plex Mono','Menlo',monospace" font-weight="700" font-size="34" fill="url(#ink)">-</text>

    <!-- Finial on top of the post -->
    <circle cx="256" cy="122" r="10" fill="url(#ink)"/>

    <!-- Base -->
    <path d="M204 400 H308 L288 420 H224 Z" fill="url(#ink)"/>
  </g>
</svg>
